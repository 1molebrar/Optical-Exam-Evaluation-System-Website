{% extends 'base.html' %}

{% block title %}Add Student — Optical Exam System{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Add Student</h1>
    <p class="page-subtitle">Register a new student in the system.</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="app-card">
            <div class="app-card-header">New Student</div>
            <div class="app-card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Student ID</label>
                        <input type="text" class="form-control" id="student_id" name="student_id" required placeholder="e.g., STU001">
                    </div>
                    <div class="mb-3">
                        <label for="first_name" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required placeholder="student@university.edu">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-app btn-app-primary">Create Student</button>
                        <a href="{% url 'student_list' %}" class="btn btn-app btn-app-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
