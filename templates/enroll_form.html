{% extends 'base.html' %}

{% block title %}Course Enrollment{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Course Enrollment</h1>
    <p class="page-subtitle">Enroll a student in a course so they can take all exams in that course.</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="app-card">
            <div class="app-card-header">Enroll Student</div>
            <div class="app-card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="student_id" class="form-label">Student</label>
                        <select class="form-select" id="student_id" name="student_id" required>
                            <option value="">Select student</option>
                            {% for student in students %}
                            <option value="{{ student.id }}">{{ student.student_id }} — {{ student.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="course_id" class="form-label">Course</label>
                        <select class="form-select" id="course_id" name="course_id" required>
                            <option value="">Select course</option>
                            {% for course in courses %}
                            <option value="{{ course.id }}" {% if course.id == preselected_course_id %}selected{% endif %}>
                                {{ course.code }} — {{ course.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-app btn-app-primary">Enroll Student</button>
                        <a href="{% url 'index' %}" class="btn btn-app btn-app-outline">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
