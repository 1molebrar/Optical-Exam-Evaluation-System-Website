<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Optical Exam System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Poppins', sans-serif; }
        body {
            background: linear-gradient(135deg, #ffeef8 0%, #fad0c4 50%, #ffd1ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            box-shadow: 0 16px 48px rgba(255, 105, 180, 0.2);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            background: linear-gradient(135deg, #ff1493 0%, #ff69b4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }
        .form-control {
            border-radius: 12px;
            border: 2px solid #ffe4f0;
            padding: 0.8rem 1rem;
            margin-bottom: 1rem;
        }
        .form-control:focus {
            border-color: #ff69b4;
            box-shadow: 0 0 0 3px rgba(255, 105, 180, 0.2);
        }
        .btn-login {
            background: linear-gradient(135deg, #ff69b4 0%, #ff1493 100%);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.8rem 2rem;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
        }
        .error-message {
            background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%);
            border: none;
            border-radius: 12px;
            color: #c62828;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .help-text {
            color: #8b7b8c;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🎓 Admin Login</h1>
            <p class="text-muted">Optical Exam Evaluation System</p>
        </div>

        {% if form.errors %}
        <div class="error-message d-flex align-items-center">
            <span class="me-2">⚠️</span> Your username or password is incorrect. Please try again.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label" style="color: #d63384; font-weight: 500;">Username</label>
                <input type="text" name="username" class="form-control" id="id_username" required placeholder="Enter username">
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label" style="color: #d63384; font-weight: 500;">Password</label>
                <input type="password" name="password" class="form-control" id="id_password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-login">Sign In</button>
        </form>

        <p class="text-center mt-3 help-text">
            Only authorized users can access this system.
        </p>
    </div>
</body>
</html>
